{% extends "base.html" %}

{% block title %}Home | Messenger{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card text-center shadow-sm">
            <div class="card-body p-5">
                <h1 class="card-title h4 mb-1">Messenger</h1>
                <p class="text-body-secondary mb-4">Messages stored in the database</p>
                <p class="display-1 fw-bold text-primary mb-0">{{ num_messages }}</p>
                <p class="text-body-secondary mt-2 mb-0">
                    {{ num_messages|pluralize:"message,messages" }} total
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
